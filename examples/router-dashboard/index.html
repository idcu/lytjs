<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>运营看板 · LytJS Router 示例</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif;
        color: #1f2933;
        background: #f5f7fa;
        min-height: 100vh;
      }
      .dashboard {
        display: flex;
        min-height: 100vh;
      }
      .sidebar {
        width: 240px;
        flex: 0 0 240px;
        background: #1e293b;
        color: #e2e8f0;
        padding: 28px 20px;
        display: flex;
        flex-direction: column;
        gap: 24px;
      }
      .brand {
        font-size: 1.15em;
        letter-spacing: 1px;
      }
      .nav {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .nav-link {
        color: #cbd5e1;
        text-decoration: none;
        padding: 10px 14px;
        border-radius: 8px;
        transition:
          background 0.2s,
          color 0.2s;
      }
      .nav-link:hover {
        background: #334155;
        color: #fff;
      }
      .nav-link.router-link-active {
        background: #2563eb;
        color: #fff;
      }
      .route-path {
        font-size: 0.8em;
        color: #94a3b8;
        margin-top: auto;
        word-break: break-all;
      }
      .route-path code {
        color: #7dd3fc;
      }
      .content {
        flex: 1;
        padding: 40px 48px;
        overflow-x: auto;
      }
      .page h2 {
        font-size: 1.5em;
        margin-bottom: 24px;
      }
      .page h3 {
        font-size: 1em;
        margin: 24px 0 10px;
        color: #475569;
      }
      .loading {
        color: #64748b;
      }
      .stats {
        display: flex;
        gap: 20px;
        flex-wrap: wrap;
      }
      .stat {
        flex: 1 1 180px;
        background: #fff;
        border-radius: 12px;
        padding: 22px 24px;
        box-shadow: 0 2px 10px rgba(15, 23, 42, 0.06);
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .stat-label {
        color: #64748b;
        font-size: 0.85em;
      }
      .stat-value {
        font-size: 1.9em;
        font-weight: 600;
        color: #2563eb;
      }
      .orders-table {
        width: 100%;
        border-collapse: collapse;
        background: #fff;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 2px 10px rgba(15, 23, 42, 0.06);
      }
      .orders-table th,
      .orders-table td {
        padding: 14px 18px;
        text-align: left;
        font-size: 0.95em;
      }
      .orders-table thead {
        background: #f1f5f9;
        color: #475569;
      }
      .orders-table tbody tr + tr {
        border-top: 1px solid #e2e8f0;
      }
      .orders-table a {
        color: #2563eb;
        text-decoration: none;
      }
      .orders-table a:hover {
        text-decoration: underline;
      }
      .detail-list {
        display: grid;
        grid-template-columns: 90px 1fr;
        gap: 10px 16px;
      }
      .detail-list dt {
        color: #64748b;
      }
      .detail-list dd {
        font-weight: 500;
      }
      .detail-items {
        list-style: none;
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }
      .detail-items li {
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 999px;
        padding: 6px 14px;
        font-size: 0.9em;
      }
      .missing,
      .not-found h2 {
        color: #b91c1c;
      }
      .not-found code {
        background: #fff;
        padding: 2px 6px;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/main.js"></script>
  </body>
</html>
