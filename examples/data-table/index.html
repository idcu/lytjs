<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>订单分析表 · LytJS 子组件示例</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif;
        color: #1f2933;
        background: #f5f7fa;
        min-height: 100vh;
      }
      .page {
        max-width: 880px;
        margin: 0 auto;
        padding: 40px 24px 64px;
      }
      .page h2 {
        font-size: 1.5em;
        margin-bottom: 22px;
      }
      .toolbar {
        display: flex;
        gap: 12px;
        align-items: center;
        flex-wrap: wrap;
        margin-bottom: 16px;
      }
      .search,
      .status-filter {
        font: inherit;
        padding: 9px 12px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        background: #fff;
      }
      .search {
        flex: 1 1 220px;
      }
      .row-count {
        color: #64748b;
        font-size: 0.9em;
        margin-left: auto;
      }
      .loading {
        color: #64748b;
      }
      .data-table-wrap {
        background: #fff;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 2px 10px rgba(15, 23, 42, 0.06);
      }
      .data-table {
        width: 100%;
        border-collapse: collapse;
      }
      .data-table th,
      .data-table td {
        padding: 13px 16px;
        text-align: left;
        font-size: 0.95em;
      }
      .data-table thead {
        background: #f1f5f9;
        color: #475569;
      }
      .data-table th {
        cursor: pointer;
        user-select: none;
        white-space: nowrap;
      }
      .data-table th.th-status {
        cursor: default;
      }
      .th-label {
        margin-right: 4px;
      }
      .sort-mark {
        color: #2563eb;
        font-size: 0.8em;
      }
      .data-table tbody tr + tr {
        border-top: 1px solid #e2e8f0;
      }
      .data-table tbody tr:hover {
        background: #f8fafc;
      }
      .data-empty {
        text-align: center;
        color: #94a3b8;
        padding: 36px 0;
      }
      .cell-amount {
        font-variant-numeric: tabular-nums;
      }
      .cell-status {
        color: #2563eb;
      }
      .pager {
        display: flex;
        gap: 14px;
        align-items: center;
        justify-content: flex-end;
        margin-top: 16px;
      }
      .pager button {
        font: inherit;
        padding: 8px 16px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        background: #fff;
        cursor: pointer;
      }
      .pager button:hover {
        background: #f1f5f9;
      }
      .page-info {
        color: #475569;
        font-size: 0.9em;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/main.js"></script>
  </body>
</html>
