<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Counter - LytJS 示例</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .container {
        background: white;
        padding: 40px;
        border-radius: 16px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        text-align: center;
      }
      h1 {
        color: #333;
        margin-bottom: 30px;
      }
      .counter {
        font-size: 4em;
        font-weight: bold;
        color: #667eea;
        margin: 30px 0;
        min-width: 150px;
      }
      .buttons {
        display: flex;
        gap: 12px;
        justify-content: center;
        margin-top: 20px;
      }
      button {
        padding: 12px 24px;
        font-size: 1.1em;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.3s;
      }
      .btn-primary {
        background: #667eea;
        color: white;
      }
      .btn-primary:hover {
        background: #5a6fd6;
      }
      .btn-secondary {
        background: #e0e0e0;
        color: #333;
      }
      .btn-secondary:hover {
        background: #d0d0d0;
      }
      .btn-danger {
        background: #f56c6c;
        color: white;
      }
      .btn-danger:hover {
        background: #e64c4c;
      }
      .doubled {
        margin-top: 15px;
        font-size: 1.2em;
        color: #999;
      }
      .back {
        margin-top: 20px;
        color: #667eea;
        text-decoration: none;
      }
      .info {
        margin-top: 20px;
        padding: 15px;
        background: #f0f0f0;
        border-radius: 8px;
        font-size: 0.9em;
        color: #666;
      }
    </style>
  </head>
  <body>
    <!-- 框架挂载点 -->
    <div id="app"></div>

    <script type="module">
      import { createApp, ref, computed } from '@lytjs/core';

      // ── 计数器组件 ──────────────────────────────────
      // 使用 ref 管理状态、computed 派生值、模板声明视图
      // 所有 DOM 更新由框架响应式系统自动完成
      const App = {
        name: 'CounterApp',
        setup() {
          const count = ref(0);
          const doubled = computed(() => count.value * 2);

          const increment = () => { count.value++; };
          const decrement = () => { count.value--; };
          const reset = () => { count.value = 0; };

          return { count, doubled, increment, decrement, reset };
        },
        template: `
          <div class="container">
            <h1>Counter 计数器</h1>
            <div class="counter">{{ count }}</div>
            <div class="buttons">
              <button class="btn-secondary" @click="decrement">-</button>
              <button class="btn-primary" @click="increment">+</button>
              <button class="btn-danger" @click="reset">重置</button>
            </div>
            <p class="doubled">Doubled: {{ doubled }}</p>
            <div class="info">
              使用 ref + computed + template<br />
              响应式更新由框架自动处理
            </div>
            <br />
            <a href="../index.html" class="back">← 返回示例列表</a>
          </div>
        `,
      };

      createApp(App).mount('#app');
    </script>
  </body>
</html>
