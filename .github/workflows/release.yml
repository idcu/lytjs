# [no-ci-release] 当前唯一远端是 gitee.com:lytjs/lytjs.git；本 workflow 不会触发。
# 发布走本地 `node scripts/release.mjs`（默认 --dry-run）。
# 保留本文件仅为将来接入 GitHub 镜像；`check-release-workflow` 会校验本标记，勿删。
name: Release

on:
  push:
    branches:
      - v7.0.0-dev

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22'

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # A11：锁文件与 package.json 必须一致（发布链路的第一环）
      - name: Verify lockfile matches package.json
        run: node scripts/check-lockfile.mjs --require-clean

      - name: Run ESLint
        run: pnpm run lint:check

      - name: Run type check
        run: pnpm run type-check

      - name: Check dependency direction
        run: pnpm run check-deps

      - name: Build all packages
        run: pnpm run build

      # A11：test tier 进发布必需，且固定 --maxWorkers=2。
      # 此前这里是 `pnpm test`（无覆盖率、并发随 runner 浮动）——
      # 「发布前的测试」和「日常的测试」口径不一致，等于没有发布前测试。
      - name: Run tests with coverage (release-required)
        run: pnpm run test:coverage -- --maxWorkers=2

      # ADR 0029：覆盖结论与**受版本控制的静态基线**逐文件比对（逐文件 / 全局 covered、
      # 未插桩集合）。档内不生成基线 —— 基线只能由 --update 显式写入。
      - name: Check coverage baseline (per-file ratchet)
        run: node scripts/check-coverage-baseline.mjs

      # A12：发布一致性（npm / tag / 76 个 package.json 三方比对）
      - name: Check release parity
        run: node scripts/check-release-parity.mjs

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v1.4.7
        with:
          publish: pnpm run release
          version: pnpm run version
          title: 'chore: version packages'
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # 发布后更新文档
      - name: Build Docs
        if: steps.changesets.outputs.published == 'true'
        # N17：vitepress 是 docs 包的 devDependency，根 node_modules 无此二进制，
        # 旧的 `pnpm run docs:build` 在发布流程里必然 not found（假绿）。
        working-directory: docs
        run: pnpm run build

      - name: Deploy Docs to GitHub Pages
        if: steps.changesets.outputs.published == 'true'
        uses: peaceiris/actions-gh-pages@v5
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/.vitepress/dist
          publish_branch: gh-pages
