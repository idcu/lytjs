name: CI

on:
  push:
    branches:
      - main
      - develop
      - 'v*.*.*-dev'
      - 'feat/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
      - develop
      - 'v*.*.*-dev'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: '11.3.0'
  NODE_VERSION: '22'

jobs:
  # 安装链路守卫（A11）：`--frozen-lockfile` 是整条验证链的第一环。
  # 独立成 job 并作为其余 job 的前置：锁文件与 package.json 漂移时，
  # 失败点直接指向「装不上」，而不是让每个 job 各自报一堆无关错误。
  install:
    name: Install (frozen lockfile)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify lockfile matches package.json
        run: node scripts/check-lockfile.mjs --require-clean

  # 构建顺序守卫（集合一致性 + 依赖拓扑）
  # 防止"新增包忘了登记 BUILD_ORDER"导致依赖方拿不到类型声明而整片构建失败
  build-order:
    name: Build Order Guard
    runs-on: ubuntu-latest
    needs: [install]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check build order
        run: pnpm run check-build-order

  # keel 扩展检查（源码级，无需 dist）：登记见 keel/checks/rules.md
  keel-gates:
    name: Keel Gates (source-only)
    runs-on: ubuntu-latest
    needs: [install]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 源码级门禁（gate 登记项：UI slot / props / 循环依赖）
        run: node scripts/gate.mjs check-ui-slot-single-node check-ui-props-wiring check-circular:src

  # 依赖安全审计
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: [install]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run pnpm audit
        run: pnpm audit --audit-level=high

  # Changeset 检查
  changeset-check:
    name: Changeset Check
    runs-on: ubuntu-latest
    needs: [install]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check for changesets
        run: pnpm changeset status --since=origin/develop

  # 代码检查
  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: [install]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm run lint:check

      - name: Run Prettier check
        run: pnpm run format:check

  # 类型检查
  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    needs: [install]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run type check
        run: pnpm run type-check

  # 单元测试
  test:
    name: Test (Node.js ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    needs: [install]
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages (tests resolve workspace deps from dist)
        run: pnpm run build

      # A11：test tier 固定 --maxWorkers=2。
      # 并发数随 runner 核数浮动会让「同一提交两次跑出不同覆盖率」，
      # 而覆盖率快照要求可复现 ⇒ 并发必须钉死。
      - name: Run tests with coverage
        run: pnpm run test:coverage -- --maxWorkers=2

      - name: Upload coverage
        if: matrix.node-version == 22
        uses: actions/upload-artifact@v5
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  # 构建
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [build-order, lint, type-check, test]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm run build

      # 单一真源：CI 在构建后统一执行 fast gate（清单只在 scripts/gate.mjs）
      - name: Fast gate (single source)
        run: node scripts/gate.mjs --tier fast

      # 需 dist 但不在 fast 档的登记项：仍通过 gate.mjs 调用，避免 CI 维护第二份命令清单
      - name: Dist-dependent gates
        run: node scripts/gate.mjs check-runtime-contract check-doc-imports

      - name: Upload build artifacts
        uses: actions/upload-artifact@v5
        with:
          name: dist
          path: |
            packages/*/dist
            packages/common/packages/*/dist
          retention-days: 7

  # 体积检查
  size-check:
    name: Size Check
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download build artifacts
        uses: actions/download-artifact@v5
        with:
          name: dist
          path: packages

      - name: Run size check
        run: pnpm run size-check
        continue-on-error: false

  # 基准测试
  benchmark:
    name: Benchmark
    runs-on: ubuntu-latest
    needs: [build]
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download build artifacts
        uses: actions/download-artifact@v5
        with:
          name: dist
          path: packages

      - name: Run benchmarks
        id: benchmark
        run: |
          # 运行基准测试并输出到文件
          pnpm -C benchmarks run bench 2>&1 | tee benchmark-results.txt

          # 提取基准测试结果并格式化
          echo "=== Benchmark Summary ==="
          grep -E "(ops/sec|render|update|memory)" benchmark-results.txt || true

      - name: Upload benchmark results
        uses: actions/upload-artifact@v5
        with:
          name: benchmark-results
          path: |
            benchmark-results.txt
          retention-days: 14

  # E2E 测试
  e2e:
    name: E2E Test (${{ matrix.browser }})
    runs-on: ubuntu-latest
    needs: [build]
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download build artifacts
        uses: actions/download-artifact@v5
        with:
          name: dist
          path: packages

      - name: Install Playwright browsers
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run E2E tests
        run: pnpm run test:e2e -- --project=${{ matrix.browser }}

      - name: Upload E2E test results
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: e2e-results-${{ matrix.browser }}
          path: |
            e2e/test-results/
            e2e/playwright-report/
          retention-days: 7
