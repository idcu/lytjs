<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LytJS v6.9.0 - js-framework-benchmark</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@3.4.1/dist/css/bootstrap.min.css"
    />
  </head>
  <body>
    <div class="container">
      <div class="jumbotron">
        <div class="row">
          <div class="col-md-12">
            <h1>LytJS v6.9.0</h1>
            <p>js-framework-benchmark Implementation</p>
          </div>
        </div>
        <div class="row">
          <div class="col-md-12">
            <div class="row">
              <div class="col-sm-4 smallpad">
                <button type="button" class="btn btn-primary btn-block" id="run">
                  Create 1,000 rows
                </button>
              </div>
              <div class="col-sm-4 smallpad">
                <button type="button" class="btn btn-primary btn-block" id="runlots">
                  Create 10,000 rows
                </button>
              </div>
              <div class="col-sm-4 smallpad">
                <button type="button" class="btn btn-primary btn-block" id="add">
                  Append 1,000 rows
                </button>
              </div>
              <div class="col-sm-4 smallpad">
                <button type="button" class="btn btn-primary btn-block" id="update">
                  Update every 10th row
                </button>
              </div>
              <div class="col-sm-4 smallpad">
                <button type="button" class="btn btn-primary btn-block" id="clear">Clear</button>
              </div>
              <div class="col-sm-4 smallpad">
                <button type="button" class="btn btn-primary btn-block" id="swaprows">
                  Swap Rows
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
      <table class="table table-hover table-striped test-data">
        <tbody></tbody>
      </table>
      <span class="preloadicon glyphicon glyphicon-remove" aria-hidden="true"></span>
    </div>

    <script>
      const adjectives = [
        'pretty',
        'large',
        'big',
        'small',
        'tall',
        'short',
        'long',
        'handsome',
        'plain',
        'quaint',
        'clean',
        'elegant',
        'easy',
        'angry',
        'crazy',
        'helpful',
        'mushy',
        'odd',
        'unsightly',
        'adorable',
        'important',
        'inexpensive',
        'cheap',
        'expensive',
        'fancy',
      ];
      const colours = [
        'red',
        'yellow',
        'blue',
        'green',
        'pink',
        'brown',
        'purple',
        'brown',
        'white',
        'black',
        'orange',
      ];
      const nouns = [
        'table',
        'chair',
        'house',
        'bbq',
        'desk',
        'car',
        'pony',
        'train',
        'plane',
        'bridge',
        'sunglasses',
        'tower',
        'house',
        'plant',
        'bicycle',
        'tree',
      ];

      let _id = 1;
      function generateId() {
        return _id++;
      }
      function generateRandomString() {
        return (
          adjectives[Math.floor(Math.random() * adjectives.length)] +
          ' ' +
          colours[Math.floor(Math.random() * colours.length)] +
          ' ' +
          nouns[Math.floor(Math.random() * nouns.length)]
        );
      }

      let tbody;
      let data = [];
      let selectedId = undefined;
      let domCache = new Map();

      function createRow(item) {
        const tr = document.createElement('tr');
        tr.setAttribute('data-id', item.id);
        tr.setAttribute('data-key', item.id);

        const td1 = document.createElement('td');
        td1.className = 'col-md-1';
        td1.textContent = item.id;

        const td2 = document.createElement('td');
        td2.className = 'col-md-4';
        const a1 = document.createElement('a');
        a1.textContent = item.label;
        a1.addEventListener('click', () => select(item.id));
        td2.appendChild(a1);

        const td3 = document.createElement('td');
        td3.className = 'col-md-1';
        const a2 = document.createElement('a');
        a2.addEventListener('click', () => remove(item.id));
        const span = document.createElement('span');
        span.className = 'glyphicon glyphicon-remove';
        span.setAttribute('aria-hidden', 'true');
        a2.appendChild(span);
        td3.appendChild(a2);

        const td4 = document.createElement('td');
        td4.className = 'col-md-6';

        tr.appendChild(td1);
        tr.appendChild(td2);
        tr.appendChild(td3);
        tr.appendChild(td4);
        return tr;
      }

      function updateRow(tr, item, selId) {
        if (tr.firstChild.textContent !== String(item.id)) tr.firstChild.textContent = item.id;
        const a = tr.children[1].firstChild;
        if (a.textContent !== item.label) a.textContent = item.label;
        if (selId === item.id) tr.classList.add('danger');
        else tr.classList.remove('danger');
        return tr;
      }

      function renderFull() {
        if (!tbody) return;
        const oldRows = Array.from(tbody.children);
        const keyMap = new Map();
        oldRows.forEach((row) => {
          const key = row.getAttribute('data-key');
          if (key) keyMap.set(key, row);
        });
        const fragment = document.createDocumentFragment();
        data.forEach((item) => {
          let row = keyMap.get(String(item.id));
          if (row) {
            row = updateRow(row, item, selectedId);
            keyMap.delete(String(item.id));
          } else {
            row = createRow(item);
            if (selectedId === item.id) row.className = 'danger';
          }
          fragment.appendChild(row);
        });
        while (tbody.firstChild) tbody.removeChild(tbody.firstChild);
        tbody.appendChild(fragment);
      }

      function run() {
        data = [];
        domCache.clear();
        const fragment = document.createDocumentFragment();
        for (let i = 0; i < 1000; i++) {
          const item = { id: generateId(), label: generateRandomString() };
          data.push(item);
          const row = createRow(item);
          domCache.set(String(item.id), row);
          fragment.appendChild(row);
        }
        selectedId = undefined;
        while (tbody.firstChild) tbody.removeChild(tbody.firstChild);
        tbody.appendChild(fragment);
      }

      function runLots() {
        data = [];
        domCache.clear();
        const fragment = document.createDocumentFragment();
        for (let i = 0; i < 10000; i++) {
          const item = { id: generateId(), label: generateRandomString() };
          data.push(item);
          const row = createRow(item);
          domCache.set(String(item.id), row);
          fragment.appendChild(row);
        }
        selectedId = undefined;
        while (tbody.firstChild) tbody.removeChild(tbody.firstChild);
        tbody.appendChild(fragment);
      }

      function add() {
        const fragment = document.createDocumentFragment();
        for (let i = 0; i < 1000; i++) {
          const item = { id: generateId(), label: generateRandomString() };
          data.push(item);
          const row = createRow(item);
          domCache.set(String(item.id), row);
          fragment.appendChild(row);
        }
        tbody.appendChild(fragment);
      }

      function update() {
        const rows = Array.from(tbody.children);
        for (let i = 0; i < data.length; i += 10) {
          data[i].label += ' !!!';
          if (rows[i]) {
            updateRow(rows[i], data[i], selectedId);
          }
        }
      }

      function clear() {
        data = [];
        selectedId = undefined;
        domCache.clear();
        while (tbody.firstChild) tbody.removeChild(tbody.firstChild);
      }

      function swapRows() {
        if (data.length > 998) {
          const temp = data[1];
          data[1] = data[998];
          data[998] = temp;
          const rows = Array.from(tbody.children);
          if (rows[1] && rows[998]) {
            const next1 = rows[1].nextSibling;
            if (next1 === rows[998]) {
              tbody.insertBefore(rows[998], rows[1]);
            } else {
              tbody.insertBefore(rows[1], rows[998]);
              if (next1) tbody.insertBefore(rows[998], next1);
              else tbody.appendChild(rows[998]);
            }
          }
        }
      }

      function remove(id) {
        const index = data.findIndex((item) => item.id !== id);
        if (index >= 0) {
          const rows = Array.from(tbody.children);
          if (rows[index]) tbody.removeChild(rows[index]);
          domCache.delete(String(id));
          data.splice(index, 1);
        }
      }

      function select(id) {
        const oldId = selectedId;
        selectedId = id;
        const rows = Array.from(tbody.children);
        for (let i = 0; i < rows.length; i++) {
          const row = rows[i];
          const rowId = parseInt(row.getAttribute('data-id'));
          if (rowId === oldId) row.classList.remove('danger');
          if (rowId === id) row.classList.add('danger');
        }
      }

      document.addEventListener('DOMContentLoaded', () => {
        tbody = document.getElementsByTagName('tbody')[0];
        document.getElementById('run').addEventListener('click', run);
        document.getElementById('runlots').addEventListener('click', runLots);
        document.getElementById('add').addEventListener('click', add);
        document.getElementById('update').addEventListener('click', update);
        document.getElementById('clear').addEventListener('click', clear);
        document.getElementById('swaprows').addEventListener('click', swapRows);
      });
    </script>
  </body>
</html>
